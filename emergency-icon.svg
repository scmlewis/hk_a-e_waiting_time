<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-hidden="true">
  <title>Emergency Department Waiting Time</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Hospital cross (centered, symmetrical) -->
  <g fill="#ffffff">
    <rect x="25" y="13" width="14" height="38" rx="3"/>
    <rect x="13" y="25" width="38" height="14" rx="3"/>
  </g>

  <!-- Clock (centered overlap) -->
  <circle cx="32" cy="32" r="13" fill="#ffffff"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <path d="M32 26v6l4.5 2.5" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="1.6" fill="#0ea5e9"/>
</svg>
